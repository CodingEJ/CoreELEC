name: Build Librespot v0.8.0
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: coreelec-21

      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential bash bc bzip2 desktop-file-utils g++ gawk gcc git gperf patch sed make make-doc patchutils python3 python3-psutil python3-setuptools python-is-python3 tar texinfo unzip xz-utils zlib1g-dev libncurses5-dev libssl-dev openssl gperf xsltproc wget zstd

      # --- NEW CACHE STEP ---
      - name: Cache CoreELEC Build Folders
        uses: actions/cache@v4
        with:
          # We cache 'sources' (downloaded code) and 'build.*' (compiled tools)
          path: |
            sources
            toolchain
            build.*
          # The key changes if package.mk changes, forcing a fresh build when needed
          key: ${{ runner.os }}-ce-build-${{ hashFiles('**/package.mk') }}
          restore-keys: |
            ${{ runner.os }}-ce-build-
      # -----------------------

      - name: Build Addon
        run: |
          PROJECT=Amlogic-ce DEVICE=Amlogic-ne ARCH=aarch64 ./scripts/build service/librespot

      - name: Upload Zip
        uses: actions/upload-artifact@v4
        with:
          name: service.librespot-v0.8.0-ne
          path: target/addons/**/*.zip
